spring.application.name=chat-back
server.port=${SERVER_PORT:8080}

# Ollama (override with env vars, e.g. OLLAMA_BASE_URL=http://my-gpu-box:11434)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:deepseek-r1:1.5b}

# MySQL (never commit real credentials; set DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chat_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
logging.level.com.example.chat_back=${LOG_LEVEL:INFO}

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Maximum prompt length accepted by /stream
app.chat.max-prompt-length=${MAX_PROMPT_LENGTH:4000}

# DevTools (dev only)
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
