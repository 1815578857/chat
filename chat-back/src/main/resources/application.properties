spring.application.name=ollama-demo
server.port=8080

#Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=deepseek-r1:1.5b


#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/chat_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.configuration.1og-impl=org.apache.ibatis.1ogging.stdout.stdoutImpl
logging.1evel.com.example.chat=DEBUG


# DevTools 热部署配置
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.livereload.enabled=true

# Swagger/OpenAPI 配置
springdoc.swagger-ui.path=/swagger-ui.html


