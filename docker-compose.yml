# One-command local setup: docker compose up -d
# Then pull a model once: docker compose exec ollama ollama pull deepseek-r1:1.5b
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: chat_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./chat-back/src/main/resources/chat_db.sql:/docker-entrypoint-initdb.d/chat_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change-me}"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./chat-back
    environment:
      DB_URL: jdbc:mysql://mysql:3306/chat_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:1.5b}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./chat-app
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  ollama-data:
